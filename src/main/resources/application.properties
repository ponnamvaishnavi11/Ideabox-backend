spring.config.import=optional:classpath:application-local.properties

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ideabox_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET:ideabox-super-secret-key-for-jwt-signing-2026-make-it-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.7-flash}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}